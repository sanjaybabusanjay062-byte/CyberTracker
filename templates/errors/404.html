{% extends "base.html" %}
{% block title %}404 Not Found — CYBERTRACE AI{% endblock %}
{% block content %}
<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:1.5rem;">
  <div style="font-size:5rem;opacity:.3;">🔍</div>
  <div>
    <h1 style="font-size:4rem;font-weight:800;color:var(--accent-cyan);line-height:1;">404</h1>
    <div style="font-size:1.1rem;font-weight:600;margin:.5rem 0;">Page Not Found</div>
    <p style="color:var(--text-muted);font-size:.88rem;">The resource you requested does not exist or has been removed.</p>
  </div>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">← Back to Dashboard</a>
</div>
{% endblock %}
