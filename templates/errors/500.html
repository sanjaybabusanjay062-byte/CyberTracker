{% extends "base.html" %}
{% block title %}500 Server Error — CYBERTRACE AI{% endblock %}
{% block content %}
<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:1.5rem;">
  <div style="font-size:5rem;opacity:.3;">⚠️</div>
  <div>
    <h1 style="font-size:4rem;font-weight:800;color:var(--accent-red);line-height:1;">500</h1>

  </div>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">← Back to Dashboard</a>

{% endblock %}
