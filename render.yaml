services:
  - type: web
    name: cybertrace-ai
    runtime: python
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: gunicorn run:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///cybertrace.db
      - key: DEBUG
        value: "False"
      - key: WTF_CSRF_ENABLED
        value: "True"
      - key: PYTHON_VERSION
        value: "3.11.6"
